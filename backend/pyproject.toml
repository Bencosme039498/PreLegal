[project]
name = "prelegal-backend"
version = "0.1.0"
description = "PreLegal API: serves the static frontend and the V1 API at http://localhost:8000"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "litellm>=1.110.3",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Noise from LiteLLM's own type definitions, not from this code.
filterwarnings = ["ignore:Items? .* (is|are) using the `ReadOnly` qualifier:UserWarning"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
